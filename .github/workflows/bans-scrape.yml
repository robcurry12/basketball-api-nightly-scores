name: BANS Nightly Scrape

on:
  schedule:
    # Run at 7am UTC (2am America/New_York during EST, 3am during EDT)
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install deps
        shell: bash
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Scrape Flashscore and write results
        shell: bash
        run: |
          node scripts/bans-scrape.mjs

      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "BANS: update latest results [skip ci]"
            git push
          fi
